euronaux à partir de mesures partielles&quot;],&quot;authors&quot;:[0,&quot;Yibo Zhou, Johannes Köhler*&quot;],&quot;links&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;PDF&quot;],&quot;href&quot;:[0,&quot;https://arxiv.org/abs/2610.16559&quot;]}],[0,{&quot;label&quot;:[0,&quot;Code&quot;],&quot;href&quot;:[0,&quot;https://github.com/YiboFrankZhou/Scalable-PEM-MHE&quot;]}]]],&quot;description&quot;:[1,[[0,&quot;L’approche réalise conjointement l’estimation d’état et l’identification de modèles de systèmes dynamiques paramétrés généraux, en associant la Prediction Error Method (PEM) à la Moving Horizon Estimation (MHE). La capacité de passage à l’échelle est démontrée sur des réseaux de neurones de grande taille, avec une accélération du calcul des hypergradients allant jusqu’à un facteur 215. Une validation sur la dynamique de véhicules de course montre également une prédiction précise et la restitution de paramètres physiquement interprétables.&quot;]]],&quot;image&quot;:[0,&quot;/images/research/scalable.png&quot;],&quot;imageAlt&quot;:[0,&quot;Scalable dynamics identification research&quot;]}],[0,{&quot;id&quot;:[0,&quot;imperial-thesis-2026&quot;],&quot;year&quot;:[0,2026],&quot;dateStart&quot;:[0,&quot;2026.01&quot;],&quot;dateEnd&quot;:[0,null],&quot;keywords&quot;:[1,[[0,&quot;MPC&quot;],[0,&quot;Robotics&quot;]]],&quot;subtitle&quot;:[0,&quot;Mémoire de master&quot;],&quot;title&quot;:[0,&quot;MPC non linéaire robuste fondée sur les données&quot;],&quot;authors&quot;:[0,&quot;Yibo Zhou, Johannes Köhler*&quot;],&quot;links&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;PDF&quot;],&quot;href&quot;:[0,&quot;#&quot;]}],[0,{&quot;label&quot;:[0,&quot;Code&quot;],&quot;href&quot;:[0,&quot;#&quot;]}]]],&quot;description&quot;:[1,[[0,&quot;Proposition d’un cadre de bout en bout intégrant des modèles dynamiques hybrides physiques et neuronaux appris, la quantification des incertitudes et une commande robuste par retour de sortie. Des bornes d’erreur de l’observateur et du contr
